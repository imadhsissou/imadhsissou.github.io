# ── Site ─────────────────────────────────────────────────────────────
title: "Imad's Astrophotography Journal"
description: "A log of my astrophotography journey — one photo at a time."
url: "https://imadhsissou.github.io"
baseurl: ""
lang: en-US

author:
  name: "Imad Hsissou"
  bio: "Amateur astrophotographer chasing photons under dark skies."

# Shown in the footer. Add/remove freely.
social:
  - title: GitHub
    url: https://github.com/imadhsissou
  - title: LinkedIn
    url: https://www.linkedin.com/in/imadhsissou/

date_format: "%B %-d, %Y"

# ── Build ────────────────────────────────────────────────────────────
markdown: kramdown
permalink: /log/:title/
# Include entries whose timestamp is slightly ahead of the build clock
# (the CMS stamps "now", which time zones can push a few minutes into the future).
future: true

# Every post is an astrophoto log entry, rendered with the entry layout.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: entry

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
