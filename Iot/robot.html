<!DOCTYPE html>
<html>
<head>
<style>

.button {
    border-radius: 4px;
    background-color: #4CAF50; /* Green */
    border: none;
    color: white;
    padding: 25px 52px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 20px;
    font-family: 'Lucida Sans Unicode' ;
    margin: 4px 2px;
    cursor: pointer;
    width: 80px;
}

.wrapper {
    text-align: center;
}

.button2 {background-color: #008CBA;} /* Blue */
.button3 {background-color: #f44336;} /* Red */

</style>
</head>
<body style="background-color : #222A30;" >

<h2 style="color : #EC4E3B; font-family: 'Lucida Sans Unicode' ; font-size: 40px;  text-align: center;">ESP8266 Web Server</h2>
<h3 style="color : gray; font-family: 'Lucida Sans Unicode' ; font-size: 25px; text-align: center;">Internet of Things - Robot Control over Wifi Network<h3>

<div class="wrapper">
    <a href="http://192.168.1.5/auto" class="button">Auto</a>
</div>

<br>

<div class="wrapper">
    <a href="http://192.168.1.5/F" class="button button2">Forward</a>
</div>

<div class="wrapper">    
    <a href="http://192.168.1.5/L" class="button button2">Left</a>
    <a href="http://192.168.1.5/S" class="button button3">Stop</a>
    <a href="http://192.168.1.5/R" class="button button2">Right</a>
</div>

<div class="wrapper">
    <a href="http://192.168.1.5/B" class="button button2">Backward</a>
</div>

</body>
</html>
